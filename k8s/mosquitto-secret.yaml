apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-password
  namespace: entangled
type: Opaque
data:
  # Generate with: echo -n 'entangled:<your-password>' | base64
  # Then encrypt with: kubectl exec mosquitto-pod -- mosquitto_passwd -U /mosquitto/config/password
  # For now, use setup_password.sh locally and copy the result:
  #   cat mqtt/config/password | base64
  password: REPLACE_WITH_BASE64_ENCODED_PASSWORD_FILE
