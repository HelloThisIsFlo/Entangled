services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: entangled-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/password:/mosquitto/config/password:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: entangled-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - mosquitto

volumes:
  mosquitto-data:
  mosquitto-log:
