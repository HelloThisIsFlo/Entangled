[project]
name = "entangled"
version = "0.1.0"
description = "Synchronized movie watching for Plex"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "paho-mqtt>=2.0",
    "plexapi>=4.15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-watch>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["entangled/entangled/tests"]
pythonpath = ["entangled"]
